<div class="auth-shell">
  <div class="auth-card">
    <h1>{{ locale.t('resetPassword.title') }}</h1>
    <p class="auth-sub">{{ locale.t('resetPassword.subtitle') }}</p>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <form class="auth-form" (submit)="submit($event)">
      <div class="form-group">
        <label for="password">{{ locale.t('resetPassword.password') }}</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          [placeholder]="locale.t('resetPassword.passwordHint')"
          required
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">{{ locale.t('resetPassword.confirmPassword') }}</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          required
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="submitting()">
        {{ submitting() ? locale.t('resetPassword.submitting') : locale.t('resetPassword.submit') }}
      </button>
    </form>

    <p class="auth-footer">
      <a routerLink="/login">{{ locale.t('resetPassword.backToSignIn') }}</a>
    </p>
  </div>
</div>
