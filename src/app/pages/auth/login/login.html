<div class="auth-shell">
  <div class="auth-card">
    <h1>{{ locale.t('login.title') }}</h1>
    <p class="auth-sub">{{ locale.t('login.subtitle') }}</p>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <form class="auth-form" (submit)="submit($event)">
      <div class="form-group">
        <label for="email">{{ locale.t('login.email') }}</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">{{ locale.t('login.password') }}</label>
          <a routerLink="/forgot-password">{{ locale.t('login.forgotPassword') }}</a>
        </div>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="submitting()">
        {{ submitting() ? locale.t('login.submitting') : locale.t('login.submit') }}
      </button>
    </form>

    <p class="auth-footer">
      {{ locale.t('login.noAccount') }} <a routerLink="/register">{{ locale.t('login.createAccount') }}</a>
    </p>
  </div>
</div>
