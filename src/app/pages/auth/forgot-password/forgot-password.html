<div class="auth-shell">
  <div class="auth-card">
    <h1>{{ locale.t('forgotPassword.title') }}</h1>
    <p class="auth-sub">{{ locale.t('forgotPassword.subtitle') }}</p>

    @if (message()) {
      <div class="alert alert-success" role="status">{{ message() }}</div>
    }
    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    @if (!message()) {
      <form class="auth-form" (submit)="submit($event)">
        <div class="form-group">
          <label for="email">{{ locale.t('forgotPassword.email') }}</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
          />
        </div>

        <button type="submit" class="submit-btn" [disabled]="submitting()">
          {{ submitting() ? locale.t('forgotPassword.submitting') : locale.t('forgotPassword.submit') }}
        </button>
      </form>
    }

    <p class="auth-footer">
      {{ locale.t('forgotPassword.remembered') }} <a routerLink="/login">{{ locale.t('forgotPassword.backToSignIn') }}</a>
    </p>
  </div>
</div>
